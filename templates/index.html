<div class="grid-inputs">
    <div>
        <label>Yaş</label>
        <input type="number" name="yas" value="{{ yas if yas else 25 }}" min="18" max="65">
        <small style="color: #666; font-size: 11px;">* 18-65 yaş arası giriniz.</small>
    </div>
    <div>
        <label>Deneyim (Yıl)</label>
        <input type="number" name="deneyim" value="{{ deneyim if deneyim else 3 }}" min="0" max="45">
        <small style="color: #666; font-size: 11px;">* En fazla yaş - 18 kadar olabilir.</small>
    </div>
    <div>
        <label>Eğitim Durumu</label>
        <select name="egitim">
            <option>Lise</option>
            <option selected>Lisans</option>
            <option>Yüksek Lisans</option>
            <option>Doktora</option>
        </select>
    </div>
    <div>
        <label>Meslek</label>
        <select name="meslek">
            <option>Frontend Geliştirici</option>
            <option>Backend Geliştirici</option>
            <option>Mobil Geliştirici</option>
            <option>Veri Bilimci</option>
            <option>Siber Güvenlik Uzmanı</option>
            <option>DevOps Mühendisi</option>
            <option>Yazılım Mimarı</option>
        </select>
    </div>
</div>
