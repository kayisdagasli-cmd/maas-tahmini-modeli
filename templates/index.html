<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maaş Tahmin Modeli</title>
    <style>
        :root {
            --dark-bg: #0f0f0f;
            --card-bg: #1a1a1a;
            --bordo: #800000;
            --light-bordo: #a00000;
            --text-main: #e0e0e0;
            --text-dim: #a0a0a0;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0; padding: 20px;
        }

        .container { max-width: 600px; margin: auto; }

        .card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border-top: 4px solid var(--bordo);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h2 { margin-top: 0; font-size: 1.5rem; color: #fff; }
        p.sub-title { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 20px; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; margin-bottom: 5px; color: var(--text-dim); }

        input, select {
            width: 100%;
            padding: 12px;
            background: #252525;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
        }

        input:focus { border-color: var(--bordo); outline: none; }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: var(--bordo);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover { background: var(--light-bordo); }

        .result-card {
            text-align: center;
            border: 1px solid var(--bordo);
            background: rgba(128, 0, 0, 0.05);
        }

        .salary-text {
            font-size: 2.5rem;
            color: var(--light-bordo);
            font-weight: 800;
            display: block;
        }

        .error { color: #ff4444; font-size: 0.8rem; margin-top: 10px; }

        /* Grafik Placeholder */
        .chart-mockup {
            height: 100px;
            display: flex;
            align-items: flex-end;
            gap: 4px;
            margin-top: 15px;
        }
        .bar { background: var(--bordo); flex: 1; border-radius: 2px 2px 0 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Maaş Tahmin Modeli</h2>
        <p class="sub-title">81 İl üzerinden 10 farklı meslek grubu için analiz</p>
        
        <form method="POST">
            <div class="form-grid">
                <div class="form-group">
                    <label>Yaş (18-65)</label>
                    <input type="number" name="yas" min="18" max="65" placeholder="25" required>
                </div>
                <div class="form-group">
                    <label>Deneyim (Yıl)</label>
                    <input type="number" name="deneyim" placeholder="3" required>
                </div>
            </div>

            <div class="form-group">
                <label>Eğitim Durumu</label>
                <select name="egitim">
                    {% for e in egitimler %}
                    <option value="{{ e }}">{{ e }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Meslek</label>
                <select name="meslek">
                    {% for m in meslekler %}
                    <option value="{{ m }}">{{ m }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Şehir</label>
                <select name="sehir">
                    {% for sehir in iller %}
                    <option value="{{ sehir }}">{{ sehir }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn-submit">Maaşı Tahmin Et</button>
            {% if hata %}<p class="error">{{ hata }}</p>{% endif %}
        </form>
    </div>

    {% if tahmin %}
    <div class="card result-card">
        <label>Tahmini Aylık Maaş</label>
        <span class="salary-text">{{ "{:,.0f}".format(tahmin).replace(',', '.') }} TL</span>
        <p style="font-size: 0.7rem; color: var(--text-dim);">Analiz: Seçilen kriterlere göre piyasa ortalamasıdır.</p>
    </div>
    {% endif %}

    <div class="card">
        <h2>Analiz & Kıyaslama</h2>
        <div class="chart-mockup">
            <div class="bar" style="height: 40%"></div>
            <div class="bar" style="height: 60%"></div>
            <div class="bar" style="height: 30%"></div>
            <div class="bar" style="height: 80%"></div>
            <div class="bar" style="height: 50%"></div>
            <div class="bar" style="height: 90%"></div>
            <div class="bar" style="height: 45%"></div>
        </div>
        <p style="font-size: 0.75rem; text-align: center; margin-top: 10px;">81 İlin Maaş Karşılaştırması</p>
    </div>
</div>

</body>
</html>
