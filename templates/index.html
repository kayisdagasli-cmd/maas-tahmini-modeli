<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Maaş Tahminleyicisi</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card);
            padding: 2.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.75rem;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: border 0.3s;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            padding: 0.8rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-top: 1rem;
        }

        button:hover {
            opacity: 0.9;
        }

        .result {
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 0.75rem;
            text-align: center;
            border: 1px dashed var(--primary);
        }

        .result h2 {
            margin: 0;
            font-size: 1.1rem;
            color: #a5b4fc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Maaş Tahmin Paneli</h1>
        <form action="/predict" method="post">
            <div class="form-group">
                <label>Yaşınız</label>
                <input type="number" name="yas" placeholder="Örn: 28" required>
            </div>
            <div class="form-group">
                <label>Deneyim Süreniz (Yıl)</label>
                <input type="number" name="deneyim" placeholder="Örn: 4" required>
            </div>
            <button type="submit">Hesaplamayı Başlat</button>
        </form>

        {% if tahmin %}
            <div class="result">
                <h2>Tahmini Maaş</h2>
                <div style="font-size: 1.5rem; font-weight: bold; margin-top: 0.5rem;">
                    ₺{{ tahmin }}
                </div>
            </div>
        {% endif %}
    </div>
</body>
</html>
